<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4f6f2b">
<title>바퀴벌레 쓰담쓰담 시뮬레이터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f6f2b'/%3E%3Cellipse cx='16' cy='17' rx='8' ry='10' fill='%238b4a24'/%3E%3Ccircle cx='13' cy='20' r='2' fill='%23fff'/%3E%3Ccircle cx='19' cy='20' r='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.2C3.5 6.6 5.8 4.5 8.4 4.5c1.6 0 2.9.8 3.6 2 .7-1.2 2-2 3.6-2 2.6 0 4.9 2.1 4.9 5.3C20.5 15.8 12 21 12 21z" fill="currentColor"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C9 3 4 9 4 15c0 1.6.4 3 1 4C4.6 17 6 13 11 11c-3 3-4 6-4 9 8 1 13-5 13-17z" fill="currentColor"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#f7b92b" stroke="#e39a10" stroke-width="1.2" stroke-linejoin="round"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f6c038" stroke="#d99a12" stroke-width="1.6"/><circle cx="12" cy="12" r="7" fill="none" stroke="#e8a81c" stroke-width="1.2"/><path d="M12 7v10M14.5 9.2c-.6-.8-1.5-1.1-2.6-1.1-1.4 0-2.4.7-2.4 1.8 0 2.4 5.2 1.2 5.2 3.7 0 1.1-1.1 1.9-2.6 1.9-1.1 0-2.1-.4-2.7-1.2" fill="none" stroke="#b97a0a" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-paw" viewBox="0 0 24 24"><g fill="currentColor"><ellipse cx="6" cy="10" rx="2.2" ry="2.8"/><ellipse cx="10.5" cy="5.8" rx="2.2" ry="2.8"/><ellipse cx="16" cy="6.2" rx="2.2" ry="2.8"/><ellipse cx="19.6" cy="11" rx="2.2" ry="2.8"/><path d="M12.5 11c-3 0-6 3.5-6 6.3 0 2 1.5 2.7 3 2.7 1.2 0 1.9-.6 3-.6s1.8.6 3 .6c1.5 0 3-.7 3-2.7 0-2.8-3-6.3-6-6.3z"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10V7.5a4 4 0 018 0V10" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#5a8a3a"/><path d="M6.5 12.5l3.8 3.8 7.2-7.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5L12 3.5l9 8M5.5 10v10h4.5v-6h4v6h4.5V10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-hand" viewBox="0 0 32 32"><g fill="#fff" stroke="#4f6f2b" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9 17V8.5a1.8 1.8 0 013.6 0V15M12.6 14V5.8a1.8 1.8 0 013.6 0V14M16.2 14V6.8a1.8 1.8 0 013.6 0V15M19.8 15v-4.2a1.8 1.8 0 013.6 0V19c0 5-3 9-8.200 9-3.600 0-5.600-1.700-7.600-5l-3.600-6a1.700 1.700 0 012.900-1.800L9 17"/></g></symbol>
    <symbol id="i-chat" viewBox="0 0 32 32"><path d="M16 4C8.800 4 4 8.400 4 14c0 3 1.500 5.600 3.800 7.400L6.500 27l5.600-3c1.200.3 2.500.5 3.900.5 7.200 0 12-4.400 12-10S23.200 4 16 4z" fill="#fff" stroke="#4a3a28" stroke-width="2" stroke-linejoin="round"/><circle cx="10.500" cy="14" r="1.700" fill="#4a3a28"/><circle cx="16" cy="14" r="1.700" fill="#4a3a28"/><circle cx="21.500" cy="14" r="1.700" fill="#4a3a28"/></symbol>
    <symbol id="i-crumb" viewBox="0 0 48 40"><g><ellipse cx="24" cy="33" rx="19" ry="5" fill="#000" opacity=".1"/><path d="M6 32c0-8 6-12 10-15 3-6 9-9 14-5 3-1 8 2 9 8 4 2 7 6 6 12z" fill="#d9a85e"/><g fill="#b98338"><circle cx="14" cy="27" r="2"/><circle cx="22" cy="21" r="2.2"/><circle cx="30" cy="26" r="2"/><circle cx="37" cy="29" r="1.800"/><circle cx="26" cy="15" r="1.600"/><circle cx="18" cy="31" r="1.500"/></g><g fill="#efca84"><circle cx="17" cy="22" r="1.700"/><circle cx="27" cy="19" r="1.600"/><circle cx="33" cy="22" r="1.500"/><circle cx="23" cy="28" r="1.700"/></g></g></symbol>
    <symbol id="i-fleaf" viewBox="0 0 48 40"><g><path d="M23 38c0-8 0-14 1-20" stroke="#3f7a2e" stroke-width="2.200" fill="none" stroke-linecap="round"/><path d="M24 20C12 20 6 13 5 5c9-1 17 3 19 15z" fill="#4f9a3a"/><path d="M24 24C34 22 42 16 43 7c-10-1-18 4-19 17z" fill="#62ae48"/><path d="M24 36C14 36 10 30 10 23c8 0 14 4 14 13z" fill="#7bc25a"/><path d="M24 19C18 15 12 10 8 7M24 22c6-4 12-9 16-13" stroke="#2f6a22" stroke-width="1.200" fill="none" opacity=".6"/></g></symbol>
    <symbol id="i-pellet" viewBox="0 0 48 40"><g><ellipse cx="24" cy="35" rx="19" ry="4" fill="#000" opacity=".1"/><g fill="#5d4128"><circle cx="12" cy="29" r="5"/><circle cx="22" cy="31" r="5"/><circle cx="33" cy="30" r="5"/><circle cx="17" cy="21" r="5"/><circle cx="28" cy="21" r="5"/><circle cx="38" cy="22" r="4.500"/><circle cx="22" cy="12" r="5"/><circle cx="12" cy="18" r="4"/><circle cx="32" cy="12" r="4.200"/></g><g fill="#8d6a45"><circle cx="10.500" cy="27" r="1.700"/><circle cx="20.500" cy="29" r="1.700"/><circle cx="31.500" cy="28" r="1.700"/><circle cx="15.500" cy="19" r="1.700"/><circle cx="26.500" cy="19" r="1.700"/><circle cx="20.500" cy="10" r="1.700"/><circle cx="30.500" cy="10" r="1.500"/></g></g></symbol>
    <symbol id="i-drop" viewBox="0 0 48 48"><path d="M24 4C18 14 11 21 11 30a13 13 0 0026 0c0-9-7-16-13-26z" fill="#5eb2ea"/><path d="M24 4C18 14 11 21 11 30a13 13 0 0026 0c0-9-7-16-13-26z" fill="none" stroke="#3b8fc9" stroke-width="1.500"/><path d="M17 31c0 4 2.500 7 6 8" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.500v5h3.500L12 18.500v-13L7.500 9.500z" fill="currentColor"/><path d="M15 9a4 4 0 010 6M17.500 6.500a8 8 0 010 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.500v5h3.500L12 18.500v-13L7.500 9.500z" fill="currentColor"/><path d="M16 9.500l5 5M21 9.500l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <!-- mini roach for header -->
    <symbol id="i-roach-mini" viewBox="0 0 60 60">
      <g fill="none" stroke="#5a3016" stroke-width="1.7" stroke-linecap="round">
        <path d="M22 44C14 50 8 54 5 58M38 44C46 50 52 54 55 58"/>
        <path d="M16 28L7 26M14 36L5 40M18 20L8 10M44 28L53 26M46 36L55 40M42 20L52 10"/>
      </g>
      <ellipse cx="30" cy="26" rx="13" ry="18" fill="#7a3d1c"/>
      <path d="M30 10C28 22 32 34 30 44" stroke="#4a2410" stroke-width="1" fill="none" opacity=".5"/>
      <ellipse cx="30" cy="42" rx="12" ry="9" fill="#c48a52"/>
      <path d="M22 40C20 44 22 48 30 49C38 48 40 44 38 40Z" fill="#8b4a24"/>
      <ellipse cx="24" cy="20" rx="3.5" ry="8" fill="#fff" opacity=".25" transform="rotate(-12 24 20)"/>
      <circle cx="24.5" cy="45" r="2.6" fill="#1a120c"/><circle cx="35.5" cy="45" r="2.6" fill="#1a120c"/>
      <circle cx="23.6" cy="44.2" r=".8" fill="#fff"/><circle cx="34.6" cy="44.2" r=".8" fill="#fff"/>
    </symbol>
  </defs>
</svg>

<div id="app">
  <header class="top">
    <img class="top-roach" src="assets/roach-mini.webp" alt="" draggable="false">
    <h1>바퀴벌레 쓰담쓰담 시뮬레이터</h1>
    <button class="rating" id="ratingBtn" aria-label="평점 4.8"><svg class="ic"><use href="#i-heart"/></svg><b>4.8</b><svg class="ic leaf"><use href="#i-leaf"/></svg></button>
  </header>

  <section class="card stats" aria-label="상태">
    <div class="stat">
      <div class="stat-h"><span class="lbl"><svg class="ic green"><use href="#i-heart"/></svg>행복도</span><b id="happyTxt">92/100</b></div>
      <div class="bar"><i id="happyBar"></i></div>
    </div>
    <div class="vsep"></div>
    <div class="stat coin">
      <div class="stat-h"><span class="lbl"><svg class="ic coinic"><use href="#i-coin"/></svg>간식 코인</span></div>
      <div class="coin-row"><b id="coinTxt">0</b><button id="coinPlus" class="plus" aria-label="무료 코인 받기">+</button></div>
    </div>
    <div class="vsep"></div>
    <div class="stat">
      <div class="stat-h"><span class="lbl"><svg class="ic"><use href="#i-star"/></svg>레벨</span><b id="lvTxt">Lv. 1</b></div>
      <div class="bar xp"><i id="xpBar"></i></div>
    </div>
  </section>

  <main id="stage" class="stage">
    <div class="wood"></div>
    <div id="leaves" class="leaves"></div>
    <button id="soundBtn" class="sound" aria-label="소리 켜기/끄기"><svg><use href="#i-mute"/></svg></button>
    <div id="fx" class="fx"></div>

    <div id="petPos" class="pet-pos">
      <div id="nameTag" class="name-tag" hidden><svg class="ic"><use href="#i-heart"/></svg><span id="nameTxt"></span></div>
      <div id="petRot" class="pet-rot">
        <div id="petLean" class="pet-lean">
          <div id="petSquish" class="pet-squish">
            <div id="pet" class="roach" role="img" aria-label="바퀴벌레">
              <div class="roach-art" id="roachArt">
                <img class="lyr body" src="assets/roach.webp" alt="" draggable="false">
                <svg class="roach-fx" viewBox="0 0 512 432" aria-hidden="true">
                  <g class="lids">
                    <g transform="rotate(18 180 248)">
                      <path d="M 150 244 A 30 14 0 0 1 210 244"/>
                    </g>
                    <g transform="rotate(18 321 294)">
                      <path d="M 289 290 A 32 14 0 0 1 353 290"/>
                    </g>
                  </g>
                  <ellipse class="hit-back" cx="210" cy="175" rx="185" ry="145" transform="rotate(18 210 175)" fill="transparent"/>
                  <ellipse class="hit-head" cx="268" cy="280" rx="125" ry="95" transform="rotate(18 268 280)" fill="transparent"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="mood" class="mood"><svg class="face" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#9be15d" stroke="#5fa02f" stroke-width="2"/><g id="faceG"></g></svg><span id="moodTxt">기분이 좋아요!</span><svg class="ic green mh"><use href="#i-heart"/></svg></div>
    <div id="hint" class="hint">바퀴벌레를 손가락으로 살살 문질러 보세요</div>
  </main>

  <section class="panel">
    <div class="card colors">
      <div class="row-h"><span class="lbl"><svg class="ic paw"><use href="#i-paw"/></svg>바퀴벌레 색상</span><span class="own">보유 색상 <b id="ownTxt">6/12</b> <svg class="ic lk"><use href="#i-lock"/></svg></span></div>
      <div id="swatches" class="swatches"></div>
    </div>
    <div class="card snacks">
      <div class="row-h snack-h"><span class="lbl"><svg class="ic leaf2"><use href="#i-leaf"/></svg>간식 / 아이템</span></div>
      <div id="snackRow" class="snack-row"></div>
    </div>
    <div class="actions">
      <button id="btnPet" class="act pet on"><svg class="aic"><use href="#i-hand"/></svg><span><b>쓰담쓰담</b><small>(기본)</small></span></button>
      <button id="btnCute" class="act cute"><svg class="aic w"><use href="#i-heart"/></svg><span><b>귀여워해줘</b><small>행복도 +10 <svg class="ic sm"><use href="#i-coin"/></svg> 10</small></span></button>
      <button id="btnName" class="act name"><svg class="aic"><use href="#i-chat"/></svg><span><b id="nameBtnT">이름 지어주기</b><small id="nameBtnS">특별한 애정</small></span></button>
    </div>
  </section>
  <nav class="nav"><button id="btnHome" class="home" aria-label="홈"><svg><use href="#i-home"/></svg></button></nav>

  <div id="toast" class="toast" role="status"></div>
  <div id="ghost" class="ghost" hidden><svg><use href="#i-crumb"/></svg></div>
  <div id="sheetWrap" class="sheet-wrap" hidden><div class="sheet" id="sheet" role="dialog"></div></div>
  <div id="lvUp" class="lvup" hidden><div class="lvup-card"><div class="big">🎉</div><h2>레벨 업!</h2><p id="lvUpTxt"></p><small>눌러서 닫기</small></div></div>
</div>
<script src="assets/embed.js"></script>
<script src="app.js"></script>
</body>
</html>
