    </div>
    <div class="vsep"></div>
    <div class="stat coin">

      <div class="coin-row"><b id="coinTxt">0</b><button id="coinPlus" class="plus" aria-label="무료 코인 받기">+</button></div>

    <div class="vsep"></div>

  </section>
