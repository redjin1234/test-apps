<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>테스트 앱</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #f6f1e7;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { width: min(560px, 100%); }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #555; line-height: 1.5; }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    a.card:hover { transform: translateY(-1px); }
    a.card h2 { margin: 0 0 6px; font-size: 1.15rem; }
    a.card span { color: #666; font-size: .95rem; line-height: 1.4; display: block; }
  </style>
</head>
<body>
  <main>
    <h1>테스트 앱</h1>
    <p>구름에서 올려 둔 테스트용 웹이에요. 아래 카드를 누르면 바로 열려요.</p>
    <a class="card" href="cockroach-pet/">
      <h2>바선생 쓰담쓰담</h2>
      <span>바퀴벌레를 쓰다듬고, 간식도 주고, 키우는 시뮬레이터.</span>
    </a>
    <a class="card" href="uv-sunscreen-test/">
      <h2>자외선 거울</h2>
      <span>자외선 지수를 확인하고, 거울 모드로 바를 곳을 안내해요.</span>
    </a>
  </main>
</body>
</html>
